# Publishes the hub image to GHCR when you push a tag server-X.Y.Z:
#   git tag server-1.0.0 && git push origin server-1.0.0
# No secrets to configure: GHCR auth uses the job's own GITHUB_TOKEN. Mirrors .gitea/workflows/publish-server.yml
# (the private Gitea pipeline, which still publishes to the internal registry).
name: publish-server

on:
  push:
    tags: ['server-*']

permissions:
  contents: write # to create the GitHub release
  packages: write # to push to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔖 Read the version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#server-}"
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "the tag must look like server-1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 🧬 Install protoc
        uses: ./.gitea/actions/setup-protoc
      - name: 🦀 Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: 🧪 Test the hub
        run: cargo test --locked -p hermes-hub
      - name: 🟢 Install Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 🧪 Test the web app
        run: npm ci && npm test
        working-directory: hermes-server/web
      - name: 🔧 Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: 🏷️ Image name (GHCR wants it lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}/hermes-server' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: 🚀 Build and push the hub image (linux/amd64)
        run: |
          docker buildx build -f hermes-server/Dockerfile --platform linux/amd64 \
            --build-arg VERSION=${{ steps.v.outputs.version }} \
            -t "$IMAGE:${{ steps.v.outputs.version }}" --push .
      # a package pushed from this repo's own workflow is linked to it automatically; no extra step needed, unlike Gitea.
      - name: 🏷️ Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Image: \`$IMAGE:${{ steps.v.outputs.version }}\`"
