# Build and test on every pull request, only for the parts that changed.
# The one required check to set in the branch protection of main is:  ci-ok
#
# What runs when:
#   hermes-server/**  -> hub (its image contains the web app too)
#   hermes-server/web/** -> web
#   agent-linux/**      -> agent-linux
#   agent-windows/**    -> agent-windows
#   pkg/**, proto/**, Cargo.*, .github/** -> everything (shared by both)
name: ci

on:
  pull_request:
    branches: [main]

# a new commit on the PR cancels the run still going for the previous one
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # pr_report.py posts the test report + coverage as a PR comment

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.diff.outputs.hub }}
      agent_linux: ${{ steps.diff.outputs.agent_linux }}
      web: ${{ steps.diff.outputs.web }}
      agent_windows: ${{ steps.diff.outputs.agent_windows }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Work out what changed
        id: diff
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "changed files:"; echo "$files"
          shared=false; hub=false; linux=false; web=false; windows=false
          echo "$files" | grep -qE '^(pkg/|proto/|Cargo\.(toml|lock)$|\.github/)' && shared=true
          echo "$files" | grep -qE '^hermes-server/' && hub=true
          echo "$files" | grep -q '^agent-linux/' && linux=true
          echo "$files" | grep -q '^hermes-server/web/' && web=true
          echo "$files" | grep -q '^agent-windows/' && windows=true
          echo "hub=$([ $shared = true ] || [ $hub = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent_linux=$([ $shared = true ] || [ $linux = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ $web = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent_windows=$([ $shared = true ] || [ $windows = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🧬 Install protoc
        uses: ./.github/actions/setup-protoc

      - name: 🦀 Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 🧰 Install coverage tools
        uses: ./.github/actions/setup-rust-coverage

      - name: 🎨 Check formatting
        run: cargo fmt --check

      - name: 🧹 Lint (clippy)
        run: cargo clippy --locked -p hermes-hub --all-targets -- -D warnings

      - name: 🧪 Test with coverage
        run: cargo llvm-cov nextest --locked --profile ci -p hermes-hub --ignore-filename-regex '/(tests|examples)/' --json --summary-only --output-path target/coverage.json

      - name: 💬 Comment the test report and coverage on the pull request
        if: always()
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python3 .github/scripts/pr_report.py --key hub --title "🦀 Hub (Rust)" --junit target/nextest/ci/junit.xml --coverage target/coverage.json

      # the tests write the TypeScript types of the web app: they must be what is committed
      - name: 📝 Check the generated TypeScript types are committed
        run: git diff --exit-code -- hermes-server/web/src/generated

      - name: 🐳 Build the hub image
        run: docker build -f hermes-server/Dockerfile -t hermes-server:ci .

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-server/web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-server/web/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔬 Type-check
        run: npm run typecheck

      - name: 🧪 Test with coverage
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: 💬 Comment the test report and coverage on the pull request
        if: always()
        working-directory: .
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python3 .github/scripts/pr_report.py --key web --title "🌐 Web (TypeScript)" --junit hermes-server/web/junit.xml --coverage hermes-server/web/coverage/coverage-summary.json --coverage-format vitest

      - name: 🔨 Build
        run: npm run build

  agent-linux:
    needs: changes
    if: needs.changes.outputs.agent_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🧬 Install protoc
        uses: ./.github/actions/setup-protoc

      - name: 🦀 Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 🧰 Install coverage tools
        uses: ./.github/actions/setup-rust-coverage

      - name: 🎨 Check formatting
        run: cargo fmt --check

      - name: 🧹 Lint (clippy)
        run: cargo clippy --locked -p hermes-proto -p hermes-agentkit -p hermes-swarm -p hermes-agent-linux --all-targets -- -D warnings

      - name: 🧪 Test with coverage
        run: cargo llvm-cov nextest --locked --profile ci -p hermes-proto -p hermes-agentkit -p hermes-swarm -p hermes-agent-linux --ignore-filename-regex '/(tests|examples)/' --json --summary-only --output-path target/coverage.json

      - name: 💬 Comment the test report and coverage on the pull request
        if: always()
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python3 .github/scripts/pr_report.py --key agent-linux --title "🐧 Linux agent (Rust)" --junit target/nextest/ci/junit.xml --coverage target/coverage.json

      - name: 🐳 Build the agent image
        run: docker build -f agent-linux/Dockerfile -t hermes-agent-linux:ci .

  # Natively on Windows, no cross-compile: compiles, lints, tests (the real kernel32 calls, not just cross-compiled and never
  # run), and builds the Windows image, all on the same windows-latest runner. docker on GitHub's Windows runners builds
  # Windows container images directly, no buildx/cross-platform trick needed (that trick is gone, along with mingw).
  agent-windows:
    needs: changes
    if: needs.changes.outputs.agent_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🧬 Install protoc
        uses: ./.github/actions/setup-protoc-windows

      - name: 🦀 Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"

      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 🎨 Check formatting
        run: cargo fmt --check

      - name: 🧹 Lint (clippy)
        run: cargo clippy --locked -p hermes-swarm -p hermes-agent-windows --all-targets -- -D warnings

      - name: 🧪 Test
        run: cargo test --locked -p hermes-swarm -p hermes-agent-windows

      - name: 🏗️ Build the release binary
        run: cargo build --release --locked -p hermes-agent-windows

      - name: 🐳 Build the Windows agent image
        run: docker build -f agent-windows/Dockerfile -t hermes-agent-windows:ci .

  # The single required check: green when every job that was needed passed or was skipped because nothing it depends on changed.
  ci-ok:
    if: always()
    needs: [changes, hub, web, agent-linux, agent-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 🚦 Fail if any job failed or was cancelled
        run: |
          echo "changes=${{ needs.changes.result }} hub=${{ needs.hub.result }} web=${{ needs.web.result }} agent-linux=${{ needs.agent-linux.result }} agent-windows=${{ needs.agent-windows.result }}"
          case "${{ needs.changes.result }} ${{ needs.hub.result }} ${{ needs.web.result }} ${{ needs.agent-linux.result }} ${{ needs.agent-windows.result }}" in
            *failure*|*cancelled*) exit 1 ;;
          esac
