version: 2
updates:
  # The Cargo workspace (hub, both agents, pkg/proto, pkg/agentkit, pkg/swarm) — one manifest at the root covers every member.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["⬆️ dependencies", "🦀 rust"]

  # HERMES, the web app.
  - package-ecosystem: npm
    directory: /hermes-server/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["⬆️ dependencies", "🟨 javascript"]

  # The workflows themselves (actions/checkout, docker/*, ...) — would have caught the Node 20 deprecation on its own.
  # Reuses our own ⚙️ ci label rather than a separate "github_actions" one Dependabot would otherwise create.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["⬆️ dependencies", "⚙️ ci"]
