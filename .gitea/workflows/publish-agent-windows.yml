# Publishes the Windows agent images when you push a tag agent-windows-X.Y.Z:
#   git tag agent-windows-1.0.1 && git push origin agent-windows-1.0.1
# A Windows image must match the Windows version of the nodes, so two images are published per version:
#   hermes-agent-windows:1.0.1-ltsc2022   (Windows Server 2022)
#   hermes-agent-windows:1.0.1-ltsc2019   (Windows Server 2019)
# Needs two repository secrets: REGISTRY_USER and REGISTRY_TOKEN (an access token with the write:package scope).
name: publish-agent-windows

on:
  push:
    tags: ['agent-windows-*']

env:
  REGISTRY_URL: ${{ github.server_url }}

jobs:
  publish:
    runs-on: homelab-linux
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔖 Read the version from the tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#agent-windows-}"
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "the tag must look like agent-windows-1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 🪟 Install the MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: 🧬 Install protoc
        uses: ./.gitea/actions/setup-protoc
      - name: 🦀 Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, targets: x86_64-pc-windows-gnu }
      - name: 📦 Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: 🧪 Test the agent
        run: cargo test --locked -p hermes-swarm -p hermes-agent-windows
      - name: 🧹 Lint for Windows (clippy)
        run: cargo clippy --locked -p hermes-agent-windows --target x86_64-pc-windows-gnu -- -D warnings
        env: { CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc, CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc }
      - name: 🔧 Set up buildx
        uses: docker/setup-buildx-action@v3
        with:
          # the BuildKit container must resolve the registry through the host DNS (it is internal), not 8.8.8.8
          driver-opts: network=host
      - name: 🌐 Work out the registry host
        run: echo "REGISTRY=${REGISTRY_URL#*://}" >> "$GITHUB_ENV"
      - name: 🔑 Log in to the registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: 🚀 Build and push the agent images (Windows Server 2022 and 2019)
        run: |
          image="$REGISTRY/${{ github.repository_owner }}/hermes-agent-windows"
          for ltsc in ltsc2022 ltsc2019; do
            docker buildx build -f agent-windows/Dockerfile --platform windows/amd64 \
              --build-arg WINDOWS_BASE=mcr.microsoft.com/windows/nanoserver:$ltsc --build-arg VERSION=${{ steps.v.outputs.version }} \
              -t "$image:${{ steps.v.outputs.version }}-$ltsc" --push .
          done
      - name: 🔗 Link the package to the repository
        # already linked on later versions, so a failure here is not fatal
        run: |
          curl -sS -X POST -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            "${{ github.server_url }}/api/v1/packages/${{ github.repository_owner }}/container/hermes-agent-windows/-/link/${{ github.event.repository.name }}" \
            -w ' -> HTTP %{http_code}\n' || true
      - name: 🏷️ Create the release
        run: |
          curl -sS -X POST -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" -H 'Content-Type: application/json' \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"body\":\"Images: \`hermes-agent-windows:${{ steps.v.outputs.version }}-ltsc2022\` and \`-ltsc2019\`\"}" \
            -w ' -> HTTP %{http_code}\n' || true
