apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.name" . }}
  labels: {{- include "hermes.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "hermes.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      appProtocol: kubernetes.io/h2c   # REST + SSE + gRPC, plain HTTP/2
