{{- if not .Values.secret.existingSecret }}
{{- $name := include "hermes.name" . }}
{{- $key := .Values.secret.value }}
{{- if not $key }}
  {{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $old $old.data (index $old.data "HUB_SECRET_KEY") }}
    {{- $key = index $old.data "HUB_SECRET_KEY" | b64dec }}
  {{- else }}
    {{- $key = sha256sum (randAlphaNum 64) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # losing this key makes the stored credentials unreadable
type: Opaque
stringData:
  HUB_SECRET_KEY: {{ $key | quote }}
{{- end }}
