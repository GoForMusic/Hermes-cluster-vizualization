[workspace]
resolver = "3"
members = ["pkg/*", "hermes-server", "agent-linux", "agent-windows"]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# the agent runs on every node: small and static matters more than compile time
# (no panic = "abort": a bug in one session must end that task, not the whole hub)
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# argon2 hashes 64 MiB per password: unoptimised it takes seconds, which makes the tests crawl
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
