[package]
name = "hermes-swarm"
description = "The Docker Swarm collector, shared by the Linux and Windows agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
gethostname = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
hermes-agentkit = { path = "../agentkit" }
hermes-proto = { path = "../proto" }
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
