[package]
name = "hermes-agent-linux"
description = "HERMES, the agent for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hermes-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
http = "1.5.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
hermes-agentkit = { path = "../pkg/agentkit" }
hermes-proto = { path = "../pkg/proto" }
hermes-swarm = { path = "../pkg/swarm" }
jiff = "0.2.37"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
